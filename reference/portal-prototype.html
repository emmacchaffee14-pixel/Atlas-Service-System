<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Atlas Service</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400;1,500&family=Jost:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --base:#FFFFFF; --raise:#F5F6F8; --ink:#111418; --soft:#5B6676;
  --rule:#D5D9E0; --olive:#7286A3; --water:#0F2340; --route:#111418;
  --good:#0F2340; --shade:#EDEFF3;
  --serif:'Jost','Futura','Century Gothic',Helvetica,Arial,sans-serif;
  --cond:'Jost','Futura','Century Gothic',Helvetica,Arial,sans-serif;
  --script:'Cormorant Garamond',Georgia,'Times New Roman',serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --base:#0B1524;--raise:#132135;--ink:#E8ECF2;--soft:#93A2B7;--rule:#26374F;
  --olive:#8FA6C4;--water:#BFD0E8;--route:#E8ECF2;--good:#BFD0E8;--shade:#17263B}}
:root[data-theme="dark"]{--base:#0B1524;--raise:#132135;--ink:#E8ECF2;--soft:#93A2B7;
  --rule:#26374F;--olive:#8FA6C4;--water:#BFD0E8;--route:#E8ECF2;--good:#BFD0E8;--shade:#17263B}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%}
body{margin:0;background:var(--base);color:var(--ink);font-family:var(--cond);font-size:16px;
  line-height:1.55;-webkit-font-smoothing:antialiased}
h1,h2,h3{margin:0;font-family:var(--serif);font-weight:600;line-height:1.22;
  letter-spacing:.01em}
p{margin:0 0 .7em}
button{font:inherit;color:inherit;cursor:pointer}
input,select,textarea{font:inherit;color:inherit}
a{color:var(--water)}
:focus-visible{outline:2px solid var(--water);outline-offset:2px;border-radius:2px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.hide{display:none!important}
.wrap{max-width:1080px;margin:0 auto;padding:0 20px 80px}
header.top{border-bottom:1px solid var(--rule);background:var(--base);
  position:sticky;top:env(safe-area-inset-top,0px);z-index:20}
.topin{max-width:1080px;margin:0 auto;padding:12px 20px;display:flex;gap:14px;
  align-items:center;flex-wrap:wrap}
.mark{font-family:var(--serif);font-weight:600;font-size:19px;letter-spacing:.1em;
  background:none;border:0;padding:0;color:var(--water);display:flex;align-items:center;gap:10px}
.mark em{font-style:normal;font-weight:300;color:var(--soft)}
.globe{width:28px;height:28px;flex:0 0 auto;fill:none;stroke:var(--water);
  stroke-linecap:butt;overflow:visible}
nav.main{display:flex;gap:2px;flex-wrap:wrap;margin-left:6px}
nav.main a{font-family:var(--cond);font-size:13px;font-weight:500;letter-spacing:.09em;
  padding:7px 13px;text-decoration:none;color:var(--soft);border-radius:2px}
nav.main a.on{background:var(--water);color:#FFFFFF}
.session{margin-left:auto;font-family:var(--cond);font-size:13px;color:var(--soft);
  display:flex;gap:10px;align-items:center}
.session b{color:var(--ink);font-weight:600}
.session button{background:none;border:0;color:var(--water);text-decoration:underline;
  font-family:var(--cond);font-size:13px;padding:0}
.gate{min-height:72vh;display:flex;flex-direction:column;justify-content:center;
  align-items:center;text-align:center;padding:56px 0 28px}
.gatemark{width:92px;height:92px;fill:none;stroke:var(--water);
  stroke-linecap:butt;overflow:visible;margin-bottom:24px}
.gate h1{font-size:clamp(26px,3.6vw,36px);font-weight:600;letter-spacing:.16em;
  line-height:1.2;color:var(--water)}
.gate .sub{font-family:var(--script);font-style:italic;font-size:22px;line-height:1.4;
  color:var(--soft);margin:14px 0 0}
.gate .rule{width:56px;height:1px;background:var(--rule);margin:26px 0 4px}
.gatefoot{font-family:var(--cond);font-size:14px;color:var(--soft);margin-top:26px}
.gatefoot a{font-weight:500;letter-spacing:.04em}
.acctcode{font-family:ui-monospace,'SF Mono',Menlo,Consolas,monospace;font-size:14px;
  letter-spacing:.12em;font-weight:600}
.tmpl{width:100%;min-height:190px;font-family:var(--cond);font-size:14px;line-height:1.6}
.termgrid .term{text-align:left}
.termgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(288px,1fr));
  gap:1px;background:var(--rule);border:1px solid var(--rule);margin-top:34px}
.term{background:var(--base);padding:26px 24px 24px}
.term h2{font-size:17px;font-family:var(--serif);letter-spacing:.12em;font-weight:600}
.term p{font-family:var(--script);font-style:italic;font-size:18px;color:var(--soft);
  margin:8px 0 18px;max-width:42ch}
.term .row{display:flex;gap:12px;flex-wrap:wrap;align-items:stretch}
.term input{flex:1 1 190px}
.term .row .btn{flex:0 0 auto}
.termnote{font-family:var(--cond);font-size:13px;color:var(--soft);margin-top:12px}
section{margin-top:38px}
.plate{display:flex;align-items:baseline;gap:12px;border-bottom:2px solid var(--water);
  padding-bottom:5px;margin-bottom:16px;flex-wrap:wrap}
.plate h2{font-size:15px;font-family:var(--serif);letter-spacing:.11em;font-weight:600}
.plate span{font-family:var(--cond);font-size:13px;color:var(--soft);margin-left:auto}
.lede{font-family:var(--script);font-style:italic;font-size:19px;color:var(--soft);
  max-width:62ch;margin-bottom:18px}
.pagehead{padding-top:30px}
.pagehead h1{font-size:clamp(26px,3.9vw,34px);font-weight:600;letter-spacing:.015em}
.pagehead p{font-family:var(--script);font-style:italic;font-size:20px;line-height:1.45;
  color:var(--soft);max-width:60ch;margin-top:10px}
.figs{display:grid;grid-template-columns:repeat(auto-fit,minmax(148px,1fr));gap:1px;
  background:var(--rule);border:1px solid var(--rule)}
.fig{background:var(--base);padding:12px 14px}
.fig b{display:block;font-family:var(--serif);font-weight:600;font-size:30px;line-height:1.1;color:var(--water)}
.fig span{font-family:var(--cond);font-size:13px;color:var(--soft)}
.fig.warn b{color:var(--route)}
.muster{display:grid;grid-template-columns:repeat(auto-fill,minmax(13px,1fr));gap:4px;
  margin:4px 0 14px;max-width:620px}
.mk{aspect-ratio:1;border:1px solid var(--rule);background:var(--raise);border-radius:1px}
.mk[data-s="none"]{background:var(--base)}
.mk[data-s="met"]{background:var(--good);border-color:var(--good)}
.mk[data-s="part"]{background:var(--olive);border-color:var(--olive);opacity:.55}
.mk[data-s="signed"]{border-color:var(--water);border-style:dashed}
.legend{font-family:var(--cond);font-size:13px;color:var(--soft);display:flex;flex-wrap:wrap;gap:16px}
.legend i{display:inline-block;width:10px;height:10px;border:1px solid var(--rule);
  background:var(--raise);margin-right:5px;vertical-align:-1px;border-radius:1px}
.legend .met i{background:var(--good);border-color:var(--good)}
.legend .part i{background:var(--olive);border-color:var(--olive);opacity:.55}
.legend .sig i{border-color:var(--water);border-style:dashed}
table{width:100%;border-collapse:collapse;font-family:var(--cond);font-size:15px}
th{text-align:left;font-weight:600;border-bottom:1.5px solid var(--water);padding:7px 10px;white-space:nowrap}
th.sort{cursor:pointer}
th.sort:hover{color:var(--water)}
td{border-bottom:1px solid var(--rule);padding:7px 10px;vertical-align:top;white-space:nowrap}
td.wrapok{white-space:normal;min-width:220px}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}
tr.tot td{border-top:1.5px solid var(--water);border-bottom:0;font-weight:700}
.scroll{overflow-x:auto}
.yes{color:var(--water);font-weight:600}
.no{color:var(--soft)}
.entry{border-top:1px solid var(--rule);padding:16px 0;display:grid;
  grid-template-columns:1fr auto;gap:10px 22px;align-items:start}
.entry:last-child{border-bottom:1px solid var(--rule)}
.entry h3{font-size:19px;font-family:var(--serif)}
.where{font-family:var(--cond);font-size:14px;color:var(--soft)}
.where b{color:var(--olive);font-weight:600}
.desc{font-size:15px;color:var(--soft);max-width:60ch;margin:6px 0 0}
.givep{font-family:var(--cond);font-size:13px;color:var(--water);margin-top:6px}
.slotside{text-align:right;min-width:158px}
.pips{display:flex;gap:3px;justify-content:flex-end;margin-bottom:6px;flex-wrap:wrap}
.pip{width:15px;height:15px;border:1px solid var(--olive);border-radius:1px}
.pip.on{background:var(--olive)}
.pip.mine{background:var(--water);border-color:var(--water)}
.cnt{font-family:var(--cond);font-size:13px;color:var(--soft);display:block;margin-bottom:8px}
.cnt.full{color:var(--route)}
.roster{font-family:var(--cond);font-size:13px;color:var(--soft);margin-top:10px;
  grid-column:1/-1;border-top:1px dotted var(--rule);padding-top:8px}
.roster ol{margin:4px 0 0;padding-left:20px;columns:2;column-gap:28px}
.roster li{margin-bottom:1px}
.roster li.open{color:var(--olive);opacity:.65;list-style:circle}
.btn{font-family:var(--cond);font-size:13px;font-weight:500;letter-spacing:.09em;padding:11px 22px;
  border:1px solid var(--water);background:var(--water);color:#FFFFFF;border-radius:2px;
  text-decoration:none;display:inline-block}
.btn[disabled]{opacity:.4;cursor:not-allowed}
.btn.ghost{background:none;color:var(--water)}
.btn.warn{border-color:var(--route);color:var(--route);background:none}
.btn.sm{font-size:12px;padding:6px 13px;letter-spacing:.07em}
form.card{border:1px solid var(--rule);background:var(--raise);padding:28px;border-radius:3px;
  max-width:880px}
.fields{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px 24px;
  align-items:end}
.fields.one{grid-template-columns:1fr}
.fields>div{display:flex;flex-direction:column;justify-content:flex-end;min-width:0}
.span2{grid-column:1/-1}
label{display:block;font-family:var(--cond);font-size:12px;font-weight:600;margin-bottom:7px;
  line-height:1.35;letter-spacing:.07em;color:var(--ink)}
label small{display:block;font-weight:400;color:var(--soft);white-space:normal;margin-top:3px;
  letter-spacing:.01em;font-size:12px;text-transform:none}
@media (min-width:660px){label{white-space:nowrap}}
@media (max-width:659px){.fields{grid-template-columns:1fr}}
input,select,textarea{width:100%;padding:0 12px;border:1px solid var(--rule);
  background:var(--base);border-radius:2px;font-family:var(--cond);font-size:15px;
  height:44px;line-height:normal;margin:0;-webkit-appearance:none;appearance:none}
select{background-image:linear-gradient(45deg,transparent 50%,var(--soft) 50%),
  linear-gradient(135deg,var(--soft) 50%,transparent 50%);
  background-position:calc(100% - 17px) 20px,calc(100% - 12px) 20px;
  background-size:5px 5px,5px 5px;background-repeat:no-repeat;padding-right:36px}
input[type=date],input[type=time]{padding-right:8px}
textarea{height:auto;min-height:104px;padding:11px 12px;resize:vertical;line-height:1.55}
.radios{display:flex;flex-direction:column;gap:9px;font-family:var(--cond);font-size:15px;
  min-height:44px;justify-content:center}
.radios.inline{flex-direction:row;gap:26px;align-items:center}
.radios label{display:flex;gap:9px;align-items:flex-start;font-weight:400;margin:0;
  white-space:normal;line-height:1.4}
.radios input{width:auto;height:auto;flex:0 0 auto;margin:3px 0 0;-webkit-appearance:radio;
  appearance:radio}
.formfoot{margin-top:18px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.note{font-family:var(--cond);font-size:13px;color:var(--soft)}
.filters{display:flex;gap:14px;flex-wrap:wrap;margin-bottom:18px;align-items:flex-end}
.filters>div{flex:0 1 186px;display:flex;flex-direction:column;justify-content:flex-end}
.flag{border-left:3px solid var(--route);background:var(--shade);padding:10px 14px;
  font-family:var(--cond);font-size:14px;margin-bottom:10px;border-radius:0 2px 2px 0}
.flag.ok{border-left-color:var(--good)}
.empty{font-family:var(--cond);color:var(--soft);padding:20px 0;font-size:15px}
.nom{border:1px solid var(--rule);padding:14px;border-radius:2px;margin-bottom:10px;background:var(--raise)}
.nom h3{font-size:18px;font-family:var(--serif)}
.nom dl{display:grid;grid-template-columns:auto 1fr;gap:2px 12px;font-family:var(--cond);font-size:14px;margin:8px 0 0}
.nom dt{color:var(--soft)}
.nom dd{margin:0}
.tag{font-family:var(--cond);font-size:12px;font-weight:600;padding:2px 8px;border-radius:2px;
  border:1px solid var(--olive);color:var(--olive)}
.tag.ok{border-color:var(--good);color:var(--good)}
.tag.no{border-color:var(--route);color:var(--route)}
#toast{position:fixed;left:50%;transform:translateX(-50%);
  bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--water);color:#FFFFFF;
  font-family:var(--cond);font-size:15px;padding:10px 20px;border-radius:2px;z-index:50;
  max-width:88vw;text-align:center}
#toast[hidden]{display:none}
@media (max-width:620px){
  .entry{grid-template-columns:1fr}
  .slotside{text-align:left}
  .pips{justify-content:flex-start}
  .plate span{width:100%;margin-left:0}
  .roster ol{columns:1}
}
</style>
</head>
<body>
<header class="top" id="hdr"><div class="topin">
  <button class="mark" id="home" aria-label="Atlas Service, home">
    <svg class="globe" viewBox="0 0 48 48" aria-hidden="true" focusable="false">
      <circle cx="24" cy="24" r="21.85" stroke-width="4.3"/>
      <ellipse cx="24" cy="24" rx="10.7" ry="21.85" stroke-width="2.6"/>
      <line x1="24" y1="2.15" x2="24" y2="45.85" stroke-width="2.4"/>
      <path d="M5.3 17.9h37.4M5.3 30.1h37.4" stroke-width="2.7"/>
    </svg>
    <span>Atlas <em>Service</em></span>
  </button>
  <nav class="main" id="nav"></nav>
  <div class="session" id="session"></div>
</div></header>
<div class="wrap" id="app"></div>
<div id="toast" hidden></div>
<script>
(function(){
"use strict";
var $=function(s){return document.querySelector(s)};
var db=null,userCap=null,ownerish=false;
var S={settings:null,roster:[],mentors:[],officers:[],orgs:{},events:[],signups:[],
  logs:[],noms:[],accounts:{},invites:{},session:null,route:"",sort:{k:"name",d:1},filt:{}};

function toast(m){var t=$("#toast");t.textContent=m;t.hidden=false;
  clearTimeout(toast._t);toast._t=setTimeout(function(){t.hidden=true},3800)}
function el(t,c,x){var n=document.createElement(t);if(c)n.className=c;if(x!=null)n.textContent=x;return n}
function td(x,c){var n=el("td",c||null);n.textContent=x;return n}
function esc(v){return v==null?"":String(v)}
function round(n){return Math.round(n*10)/10}
function keyOf(e){return String(e||"").trim().toLowerCase()}
function store(k,v){try{if(v===undefined)return localStorage.getItem(k);
  if(v===null)localStorage.removeItem(k);else localStorage.setItem(k,v)}catch(e){}return null}
function fmtDate(iso){if(!iso)return"";var p=String(iso).split("-");if(p.length!==3)return iso;
  return new Date(+p[0],+p[1]-1,+p[2]).toLocaleDateString(undefined,
    {weekday:"short",month:"short",day:"numeric"})}
function req(){return S.settings&&S.settings.hourRequirement!=null?+S.settings.hourRequirement:3}
function cap(){return S.settings&&S.settings.swabCap!=null?+S.settings.swabCap:1}
function eventById(id){for(var i=0;i<S.events.length;i++)if(S.events[i].id===id)return S.events[i];return null}
function orgOf(ev){return(ev&&S.orgs[ev.orgId])||{}}
function evName(ev){return ev?((orgOf(ev).name||ev.orgId)+" \u2014 "+fmtDate(ev.date)):""}
function isSwab(ev){return!!ev&&ev.orgId==="ados"}
function claimsFor(id){return S.signups.filter(function(s){return s.eventId===id})}
function logsFor(id){return S.logs.filter(function(l){return l.eventId===id})}
function memberBy(email){var k=keyOf(email);
  for(var i=0;i<S.roster.length;i++)if(keyOf(S.roster[i].email)===k)return S.roster[i];return null}
function groupOf(n){for(var i=0;i<S.mentors.length;i++)if(S.mentors[i].name===n)return S.mentors[i].group||"";return ""}
function stats(email){
  var k=keyOf(email);
  var mine=S.logs.filter(function(l){return l.memberKey===k});
  var total=0,swab=0;
  mine.forEach(function(l){var h=+l.hours||0;total+=h;if(isSwab(eventById(l.eventId)))swab+=h});
  return{total:round(total),swab:round(swab),countable:round(total-Math.max(0,swab-cap())),
    logs:mine.length,claims:S.signups.filter(function(s){return s.memberKey===k}).length,
    met:(total-Math.max(0,swab-cap()))>=req()};
}
function evStats(ev){
  var c=claimsFor(ev.id),lg=logsFor(ev.id),hours=0,rep=0,qn=0;
  lg.forEach(function(l){hours+=+l.hours||0;
    if(l.quantity!=null&&l.quantity!==""){rep+=+l.quantity||0;qn++}});
  return{claimed:c.length,cap:+ev.capacity||0,logs:lg.length,hours:round(hours),
    rep:rep,ver:qn?Math.round(rep/qn):0};
}
function go(r){location.hash="#"+r}
function route(){
  var h=(location.hash||"").replace(/^#/,"")||"/";
  S.route=h;var s=S.session;
  if(h!=="/"&&h!=="/setup"&&!s){go("/");return}
  if(h==="/setup"&&s){go(s.role==="admin"?"/admin":"/member/opportunities");return}
  if(s&&s.role==="member"&&h.indexOf("/admin")===0){go("/member/opportunities");return}
  if(s&&s.role==="admin"&&h.indexOf("/member")===0&&h!=="/member/opportunities"){go("/admin");return}
  render();
}
window.addEventListener("hashchange",route);
$("#home").onclick=function(){go(S.session?(S.session.role==="admin"?"/admin":"/member/opportunities"):"/")};
var MEMBER_NAV=[["/member/opportunities","Opportunities"],["/member/log","Log Service"],
  ["/member/nominate","Nominate"],["/member/standing","My Standing"]];
var ADMIN_NAV=[["/admin","Dashboard"],["/admin/members","Members"],["/admin/groups","Groups"],
  ["/admin/events","Events"],["/admin/nominations","Nominations"],["/admin/settings","Settings"]];
function renderChrome(){
  var nav=$("#nav"),ses=$("#session");nav.textContent="";ses.textContent="";
  if(!S.session){$("#hdr").classList.add("hide");return}
  $("#hdr").classList.remove("hide");
  (S.session.role==="admin"?ADMIN_NAV:MEMBER_NAV).forEach(function(p){
    var a=el("a",S.route===p[0]?"on":null,p[1]);a.href="#"+p[0];nav.appendChild(a)});
  var who=el("span");
  who.appendChild(document.createTextNode(S.session.role==="admin"?"Officer \u00b7 ":""));
  who.appendChild(el("b",null,S.session.name));ses.appendChild(who);
  var out=el("button",null,"Sign out");
  out.onclick=function(){S.session=null;store("atlas.session",null);go("/")};
  ses.appendChild(out);
}
function labelFor(id,text,sub){var l=el("label",null,text);if(id)l.htmlFor=id;
  if(sub)l.appendChild(el("small",null,sub));return l}
function opt(v,t){var o=el("option",null,t);o.value=v;return o}
function field(lbl,type,val,id,reqd,sub,ro,span){
  var w=el("div",span?"span2":null);w.appendChild(labelFor(id,lbl,sub));
  var i=el("input");i.type=type;i.id=id;if(val)i.value=val;if(reqd)i.required=true;
  if(ro){i.readOnly=true;i.style.color="var(--soft)"}
  w.appendChild(i);return w}
function area(id,lbl,sub,reqd){
  var w=el("div","span2");w.appendChild(labelFor(id,lbl,sub));
  var t=el("textarea");t.id=id;if(reqd)t.required=true;w.appendChild(t);return w}
function pageHead(a,title,sub){var h=el("div","pagehead");h.appendChild(el("h1",null,title));
  if(sub)h.appendChild(el("p",null,sub));a.appendChild(h)}
function plate(title,right){var p=el("div","plate");p.appendChild(el("h2",null,title));
  if(right)p.appendChild(el("span",null,right));return p}
function table(heads,classes){
  var w=el("div","scroll"),t=el("table"),th=el("thead"),tr=el("tr");
  heads.forEach(function(h,i){tr.appendChild(el("th",(classes&&classes[i])||null,h))});
  th.appendChild(tr);t.appendChild(th);var tb=el("tbody");t.appendChild(tb);w.appendChild(t);
  return{wrap:w,body:tb,head:tr}}

/* ───────── credentials (prototype only) ───────── */
/* Supabase hashes passwords properly in production; this stands in so the
   invite-and-set-your-own-password flow can be demonstrated end to end.
   A password is never stored or transmitted in the clear. */
function randCode(n){
  var A="ABCDEFGHJKMNPQRSTUVWXYZ23456789",o="",b=new Uint8Array(n);
  crypto.getRandomValues(b);
  for(var i=0;i<n;i++)o+=A[b[i]%A.length];
  return o;
}
async function hashPw(pw,salt){
  var buf=await crypto.subtle.digest("SHA-256",new TextEncoder().encode(salt+":"+pw));
  return Array.prototype.map.call(new Uint8Array(buf),
    function(b){return("0"+b.toString(16)).slice(-2)}).join("");
}
function isOfficerEmail(e){var k=keyOf(e);
  return S.officers.some(function(x){return keyOf(x.email)===k})}
function officerRec(e){var k=keyOf(e);
  return S.officers.filter(function(x){return keyOf(x.email)===k})[0]||null}
function accountFor(e){return S.accounts[keyOf(e)]||null}
function displayName(e){
  var m=memberBy(e);if(m)return m.name;
  var o=officerRec(e);return o&&o.name?o.name:e;
}

async function signIn(role,email,pw){
  var k=keyOf(email);
  if(!k||!pw){toast("Enter your email and password.");return}
  if(role==="member"&&!memberBy(k)){
    toast("That email is not on the Fall 2026 roster. Check with an officer.");return}
  if(role==="admin"&&!isOfficerEmail(k)){
    toast("That email is not on the officer list.");return}
  var acct=accountFor(k);
  if(!acct){toast("No account yet. Use Set Up Your Account with the code from your welcome email.");return}
  var h=await hashPw(pw,acct.salt);
  if(h!==acct.hash){toast("That password is not right.");return}
  S.session={role:role,email:k,name:displayName(k)};
  store("atlas.session",JSON.stringify(S.session));
  go(role==="admin"?"/admin":"/member/opportunities");
  toast("Welcome back, "+S.session.name.split(" ")[0]+".");
}

async function createAccount(email,code,pw,pw2,firstOfficer,name){
  var k=keyOf(email);
  if(!k){toast("Enter your UGA email.");return}
  if(pw.length<8){toast("Pick a password of at least 8 characters.");return}
  if(pw!==pw2){toast("Those two passwords do not match.");return}
  if(accountFor(k)){toast("That account already exists. Sign in instead.");return}
  if(firstOfficer){
    if(!name.trim()){toast("Enter your name.");return}
    if(S.officers.length){toast("An officer already exists. Use your invite code.");return}
  }else{
    if(!memberBy(k)&&!isOfficerEmail(k)){
      toast("That email is not on the roster or the officer list.");return}
    var inv=S.invites[k];
    if(!inv){toast("No invite code has been issued for that email yet.");return}
    if(inv.usedAt){toast("That code has already been used.");return}
    if(keyOf(code)!==keyOf(inv.code)){toast("That code does not match.");return}
  }
  if(!needDb())return;
  var salt=randCode(16),h=await hashPw(pw,salt);
  try{
    await db.collection("accounts").doc(k).set({
      email:k,salt:salt,hash:h,createdAt:new Date().toISOString()});
    if(firstOfficer){
      await db.doc("roster/officers").set({list:[{name:name.trim(),email:k}]});
    }else{
      await db.collection("invites").doc(k).set(
        Object.assign({},S.invites[k],{usedAt:new Date().toISOString()}));
    }
    var role=(firstOfficer||isOfficerEmail(k))?"admin":"member";
    S.session={role:role,email:k,name:firstOfficer?name.trim():displayName(k)};
    store("atlas.session",JSON.stringify(S.session));
    go(role==="admin"?"/admin":"/member/opportunities");
    toast("Account created. You are signed in.");
  }catch(e){toast("Could not create that account. Try again.")}
}

function needDb(){if(!db){toast("Still connecting. Try again in a second.");return false}return true}

async function claimSlot(ev,extra,btn){
  if(!needDb())return;
  var k=keyOf(S.session.email);
  btn.disabled=true;btn.textContent="Claiming\u2026";
  try{
    var got=await db.doc("locks/"+ev.id).acquire({holder:k,ttlMs:6000});
    if(!got.acquired){toast("Someone else is claiming a spot right now. Try again in a moment.");return}
    var snap=await db.collection("signups").where("eventId","==",ev.id).get();
    var taken=snap.docs.map(function(d){return d.data()});
    if(taken.some(function(t){return t.memberKey===k})){
      toast("You are already on this list.");go("/member/opportunities");return}
    var c=+ev.capacity||0;
    if(c&&taken.length>=c){toast("That was the last spot \u2014 this event just filled up.");
      go("/member/opportunities");return}
    await db.collection("signups").doc(ev.id+"__"+k).set({
      eventId:ev.id,memberKey:k,memberName:S.session.name,email:S.session.email,
      mentor:extra.mentor,transportation:extra.transportation,advocating:extra.advocating,
      notes:extra.notes,createdAt:new Date().toISOString()});
    var me=memberBy(S.session.email);
    if(me&&!me.mentor)await saveMemberMentor(S.roster.indexOf(me),extra.mentor,true);
    toast("Spot claimed. File a service log after you go.");
    go("/member/opportunities");
  }catch(e){toast(e&&e.code==="invalid_argument"?
    "This view cannot claim spots. Ask an officer to give you access.":
    "Could not claim that spot. Try again.")}
  finally{btn.disabled=false;btn.textContent="Claim my spot"}
}
async function releaseSlot(ev){
  if(!needDb())return;
  if(!confirm("Give up your spot at "+evName(ev)+
    "?\n\nDo not do this within 48 hours of the event \u2014 text Emma instead."))return;
  try{await db.collection("signups").doc(ev.id+"__"+keyOf(S.session.email)).delete();
    toast("Spot released.")}catch(e){toast("Could not release that spot.")}
}

async function addOfficer(name,email){
  if(!needDb())return;
  var list=S.officers.slice();
  if(list.some(function(x){return keyOf(x.email)===keyOf(email)})){toast("Already an officer.");return}
  list.push({name:name.trim(),email:keyOf(email)});
  try{await db.doc("roster/officers").set({list:list});toast("Officer added.")}
  catch(e){toast("Could not add that officer.")}
}
function peopleList(){
  var out=S.roster.map(function(m){return{name:m.name,email:keyOf(m.email),kind:"Member"}});
  S.officers.forEach(function(o){
    var k=keyOf(o.email),hit=out.filter(function(x){return x.email===k})[0];
    if(hit)hit.kind="Officer";
    else out.push({name:o.name||o.email,email:k,kind:"Officer"})});
  return out;
}
function acctState(email){
  var k=keyOf(email);
  if(S.accounts[k])return "Active";
  if(S.invites[k]&&!S.invites[k].usedAt)return "Invited";
  return "Not invited";
}
async function issueCode(email){
  if(!needDb())return;
  var k=keyOf(email);
  try{
    await db.collection("invites").doc(k).set({
      email:k,code:randCode(8),issuedAt:new Date().toISOString(),usedAt:null});
    toast("Code issued for "+k+".");
  }catch(e){toast("Could not issue that code.")}
}
async function issueAllCodes(btn){
  if(!needDb())return;
  var todo=peopleList().filter(function(x){return acctState(x.email)==="Not invited"});
  if(!todo.length){toast("Everyone already has a code or an account.");return}
  btn.disabled=true;btn.textContent="Issuing\u2026";
  var n=0;
  for(var i=0;i<todo.length;i++){
    try{
      await db.collection("invites").doc(todo[i].email).set({
        email:todo[i].email,code:randCode(8),
        issuedAt:new Date().toISOString(),usedAt:null});
      n++;
    }catch(e){}
  }
  btn.disabled=false;btn.textContent="Issue Codes For Everyone Without One";
  toast(n+" code"+(n===1?"":"s")+" issued.");
}
async function resetAccount(email){
  if(!needDb())return;
  var k=keyOf(email);
  if(!confirm("Reset the account for "+k+"?\n\nTheir password stops working and they set a new one with a fresh code."))return;
  try{
    await db.collection("accounts").doc(k).delete();
    await db.collection("invites").doc(k).set({
      email:k,code:randCode(8),issuedAt:new Date().toISOString(),usedAt:null});
    toast("Account reset. A new code is ready to send.");
  }catch(e){toast("Could not reset that account.")}
}
async function removeOfficer(i){
  if(!needDb())return;
  var list=S.officers.slice();list.splice(i,1);
  try{await db.doc("roster/officers").set({list:list});toast("Officer removed.")}
  catch(e){toast("Could not remove that officer.")}
}
async function exportCsv(rows){
  var dl=await window.claude.use("downloads");
  if(!dl){toast("Downloads are not available in this view.");return}
  var out=[["Member","Email","Mentor","Group","Spots","Logs","Hours","BookDrive","Counting","Met"]];
  rows.forEach(function(r){out.push([r.m.name,r.m.email,r.m.mentor||"",r.group||"",
    r.st.claims,r.st.logs,r.st.total,r.st.swab,r.st.countable,r.st.met?"Yes":"No"])});
  var csv=out.map(function(r){return r.map(function(c){var v=esc(c);
    return /[",\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v}).join(",")}).join("\n");
  try{await dl.save({filename:"atlas-members.csv",data:csv})}catch(e){toast("Export cancelled.")}
}

function render(){
  renderChrome();
  var a=$("#app");a.textContent="";
  var h=S.route,s=S.session;
  if(h==="/setup"&&!s){viewSetup(a);return}
  if(!s){viewGate(a);return}
  if(h.indexOf("/member/signup/")===0){viewSignup(a,h.slice("/member/signup/".length));return}
  switch(h){
    case"/member/opportunities":viewOpportunities(a);break;
    case"/member/log":viewLog(a);break;
    case"/member/nominate":viewNominate(a);break;
    case"/member/standing":viewStanding(a);break;
    case"/admin":viewDashboard(a);break;
    case"/admin/members":viewMembers(a);break;
    case"/admin/groups":viewGroups(a);break;
    case"/admin/events":viewEvents(a);break;
    case"/admin/nominations":viewNominations(a);break;
    case"/admin/settings":viewSettings(a);break;
    default: if(s.role==="admin")viewDashboard(a);else viewOpportunities(a);
  }
}

(function(){var raw=store("atlas.session");
  if(raw){try{S.session=JSON.parse(raw)}catch(e){}}
  S.route=(location.hash||"").replace(/^#/,"")||"/";render()})();

(async function(){
  userCap=await window.claude.use("user");
  if(userCap){try{ownerish=(await userCap.isOwner())||(await userCap.canEdit())}catch(e){}}
  db=await window.claude.use("db");
  if(!db){toast("Running without a connection \u2014 nothing will save.");render();return}
  var doc=function(p,fn){db.doc(p).onSnapshot(function(s){fn(s.exists?s.data():null);route()},function(){})};
  var coll=function(p,fn){db.collection(p).onSnapshot(function(s){
    fn(s.docs.map(function(d){var o=Object.assign({},d.data());o.id=d.id;return o}));route()},function(){})};
  doc("settings/config",function(d){S.settings=d});
  doc("roster/members",function(d){S.roster=d&&Array.isArray(d.list)?d.list:[]});
  doc("roster/mentors",function(d){S.mentors=d&&Array.isArray(d.list)?d.list:[]});
  doc("roster/officers",function(d){S.officers=d&&Array.isArray(d.list)?d.list:[]});
  db.collection("orgs").onSnapshot(function(s){var m={};
    s.docs.forEach(function(d){m[d.id]=Object.assign({id:d.id},d.data())});S.orgs=m;route()},function(){});
  coll("events",function(v){S.events=v});
  coll("signups",function(v){S.signups=v});
  coll("logs",function(v){S.logs=v});
  coll("nominations",function(v){S.noms=v});
  db.collection("accounts").onSnapshot(function(sn){var m={};
    sn.docs.forEach(function(d){m[d.id]=d.data()});S.accounts=m;route()},function(){});
  db.collection("invites").onSnapshot(function(sn){var m={};
    sn.docs.forEach(function(d){m[d.id]=d.data()});S.invites=m;route()},function(){});
})();
})();
</script>
